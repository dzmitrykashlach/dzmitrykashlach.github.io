title: Dzmitry Kashlach
email: dzmitrykashlach@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Custom CNC woodworking, carving and CAD/CAM services.
baseurl: "" # the subpath of your site, e.g. /blog
url: https://dzmitrykashlach.github.io/ # the base hostname & protocol for your site, e.g. http://example.com
linkedin_username: dzmitrykashlach
github_username:  dzmitrykashlach
instagram_username: dzmitrykashlach

minima:
  social_links:
    - { platform: github,  user_url: "https://github.com/dzmitrykashlach" }
    - { platform: instagram, user_url: "https://www.instagram.com/dzmitrykashlach/" }
header_pages:
  - resume_en.markdown
# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-redirect-from

# Exclude from processing.
#
# Important: in Jekyll 3, a custom `exclude` list replaces the default array (it is
# not merged). List both Jekyll defaults and project-specific paths, or `node_modules`
# can be read as pages and pollute the Minima nav.
#
# Excluded items can be processed by explicitly listing them under `include:`.
#
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - job/it-job-channels.md
  - job/
  - tech-trends/
  - .github/
  - package.json
  - package-lock.json

collections:
  projects:
    output: true
    permalink: /:collection/:title